[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "joinmarket-stats"
version = "0.1.0"
description = "An independently verifiable, self-hostable JoinMarket market observatory"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "PuLP==3.3.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "playwright>=1.50"]

[project.scripts]
jmstats = "jmstats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jmstats = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
